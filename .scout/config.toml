[scout]
provider = "openrouter"
model = "moonshotai/kimi-k3"
sandbox = true
gate = "uvx ruff check scout.py scoutlib tests && uv run pytest -q"
max_rounds = 24
bash_timeout = 180
gate_timeout = 600
recon_max_rounds = 16
